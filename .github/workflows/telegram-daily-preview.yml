name: Generate and send football preview to Telegram

on:
  workflow_dispatch:
    inputs:
      fixtures_json:
        description: "JSON array of fixtures with match_id, home, away, timezone-aware kickoff, home_expected_goals and away_expected_goals"
        required: true
        type: string
      max_legs:
        description: "Maximum preview selections (1-20)"
        required: true
        default: "12"
        type: string
      send_telegram:
        description: "Send the generated preview to the configured Telegram chat"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-daily-preview
  cancel-in-progress: false

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SEND_TELEGRAM: ${{ inputs.send_telegram }}
      MAX_LEGS: ${{ inputs.max_legs }}
    steps:
      - name: Checkout isolated project branch
        uses: actions/checkout@v4
        with:
          ref: codex/daily-single-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate inputs and secrets
        env:
          FIXTURES_JSON: ${{ inputs.fixtures_json }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          rows = json.loads(os.environ["FIXTURES_JSON"])
          if not isinstance(rows, list):
              raise SystemExit("fixtures_json must be a JSON array")
          if not 1 <= int(os.environ["MAX_LEGS"]) <= 20:
              raise SystemExit("max_legs must be between 1 and 20")
          for row in rows:
              for key in ("match_id", "home", "away", "kickoff", "home_expected_goals", "away_expected_goals"):
                  if key not in row:
                      raise SystemExit(f"fixture missing {key}")
          if os.environ["SEND_TELEGRAM"].lower() == "true":
              for name in ("TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"):
                  if not os.environ.get(name, "").strip():
                      raise SystemExit(f"Missing GitHub Actions secret: {name}")
          with open("fixtures-input.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, ensure_ascii=False)
          PY
      - name: Install project
        run: python -m pip install .
      - name: Generate prediction preview
        run: python -m football_analysis.daily_pipeline fixtures-input.json --output artifacts/daily_coupon.json --max-legs "$MAX_LEGS"
      - name: Send preview to Telegram
        if: inputs.send_telegram
        run: python -m football_analysis.telegram_publisher artifacts/daily_coupon.json --send
      - name: Print dry-run preview
        if: ${{ !inputs.send_telegram }}
        run: python -m football_analysis.telegram_publisher artifacts/daily_coupon.json
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: football-daily-preview
          path: artifacts/daily_coupon.json
          if-no-files-found: error
          retention-days: 7
