name: Generate football analysis preview (dry run only)

on:
  workflow_dispatch:
    inputs:
      fixtures_json:
        description: "JSON array of fixtures with match_id, home, away, timezone-aware kickoff, home_expected_goals and away_expected_goals"
        required: true
        type: string
      max_legs:
        description: "Maximum preview selections (1-20)"
        required: true
        default: "12"
        type: string

permissions:
  contents: read

concurrency:
  group: football-analysis-preview
  cancel-in-progress: false

jobs:
  generate-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAX_LEGS: ${{ inputs.max_legs }}
    steps:
      - name: Checkout isolated project branch
        uses: actions/checkout@v4
        with:
          ref: codex/daily-single-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate inputs
        env:
          FIXTURES_JSON: ${{ inputs.fixtures_json }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          rows = json.loads(os.environ["FIXTURES_JSON"])
          if not isinstance(rows, list):
              raise SystemExit("fixtures_json must be a JSON array")
          if not 1 <= int(os.environ["MAX_LEGS"]) <= 20:
              raise SystemExit("max_legs must be between 1 and 20")
          for row in rows:
              for key in ("match_id", "home", "away", "kickoff", "home_expected_goals", "away_expected_goals"):
                  if key not in row:
                      raise SystemExit(f"fixture missing {key}")
          with open("fixtures-input.json", "w", encoding="utf-8") as f:
              json.dump(rows, f, ensure_ascii=False)
          PY
      - name: Install project
        run: python -m pip install .
      - name: Generate local preview (no publication)
        run: python -m football_analysis.daily_pipeline fixtures-input.json --output artifacts/daily_analysis.json --max-legs "$MAX_LEGS"
      - name: Upload generated report
        uses: actions/upload-artifact@v4
        with:
          name: football-analysis-preview
          path: artifacts/daily_analysis.json
          if-no-files-found: error
          retention-days: 7
