name: Daily API-Football analysis and Telegram delivery

on:
  push:
    branches:
      - codex/daily-single-pipeline
    paths:
      - .github/workflows/daily-api-football-selection.yml
  workflow_dispatch:
    inputs:
      match_date:
        description: "Date locale Djibouti YYYY-MM-DD (vide = aujourd'hui)"
        required: false
        type: string
      send_telegram:
        description: "Envoyer le rapport à Telegram"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-api-football-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MATCH_DATE: ${{ inputs.match_date }}
      SEND_TELEGRAM: ${{ github.event_name == 'push' || inputs.send_telegram == true }}
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: codex/daily-single-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration and local date
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY" || { echo "::error::Missing API_FOOTBALL_KEY repository secret"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "::error::Missing SUPABASE_URL repository secret"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1; }
          if [ "$SEND_TELEGRAM" = "true" ]; then
            test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing TELEGRAM_BOT_TOKEN repository secret"; exit 1; }
            test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing TELEGRAM_CHAT_ID repository secret"; exit 1; }
          fi
          if [ -z "${MATCH_DATE:-}" ]; then
            MATCH_DATE="$(TZ=Africa/Djibouti date +%F)"
            echo "MATCH_DATE=$MATCH_DATE" >> "$GITHUB_ENV"
          fi
      - name: Install project
        run: python -m pip install .
      - name: Collect today's fixtures, recent form, statistics and 1xBet odds; predict
        shell: bash
        run: |
          set -euo pipefail
          args=(--date "$MATCH_DATE" --market-weight 0.65 --max-legs 8 --output artifacts/daily_analysis.json)
          if [ "$SEND_TELEGRAM" = "true" ]; then args+=(--send); fi
          python -m football_analysis.daily_api_pipeline "${args[@]}"
      - name: Upload collected data and prediction report
        uses: actions/upload-artifact@v4
        with:
          name: daily-football-analysis
          path: artifacts/daily_analysis.json
          if-no-files-found: error
          if: always()
          retention-days: 14

# Full historical fixture-stat collection is enabled by default (0 = no local cap).
# Trigger a fresh run after the H2H provider-validation fallback fix.
