name: Manual API-Football daily analysis (dry run only)

on:
  workflow_dispatch:
    inputs:
      match_date:
        description: "Date locale Djibouti YYYY-MM-DD (vide = aujourd'hui)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-api-football-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      MATCH_DATE: ${{ inputs.match_date }}
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: codex/daily-single-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate API configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY" || { echo "::error::Missing API_FOOTBALL_KEY"; exit 1; }
          if [ -z "${MATCH_DATE:-}" ]; then
            MATCH_DATE="$(TZ=Asia/Djibouti date +%F)"
            echo "MATCH_DATE=$MATCH_DATE" >> "$GITHUB_ENV"
          fi
      - name: Install project
        run: python -m pip install .
      - name: Generate local analysis report (no publication)
        run: python -m football_analysis.daily_api_pipeline --date "$MATCH_DATE" --output artifacts/daily_analysis.json
      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: daily-football-analysis
          path: artifacts/daily_analysis.json
          if-no-files-found: error
          retention-days: 14
