name: Manual API-Football connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - name: Check API key is configured
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_FOOTBALL_KEY" || { echo "::error::Missing API_FOOTBALL_KEY secret"; exit 1; }
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: codex/daily-single-pipeline
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install .
      - name: Check API-Football status endpoint
        run: |
          python - <<'PY'
          from football_analysis.api_football_client import ApiFootballClient
          client = ApiFootballClient()
          client.get("status")
          quota = client.last_quota
          print("PASS: API-Football authentication and status endpoint")
          print("Daily remaining:", quota.daily_remaining if quota.daily_remaining is not None else "not provided")
          print("Per-minute remaining:", quota.minute_remaining if quota.minute_remaining is not None else "not provided")
          PY
