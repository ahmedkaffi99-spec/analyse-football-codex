name: Python tests

on:
  push:
    branches: ["codex/initial-analysis-engine", "codex/daily-single-pipeline", "codex/full-system-from-original", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run full test suite
        run: python -m pytest -q
