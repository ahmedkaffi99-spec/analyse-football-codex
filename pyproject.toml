[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analyse-football-codex"
version = "0.1.0"
description = "Independent, offline-first football probability evaluation and backtesting core"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]
